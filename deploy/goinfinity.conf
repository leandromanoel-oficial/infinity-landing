# =============================================================================
#  Infinity System — landing page estática
#  goinfinity.com.br
#
#  Instalar em:  /etc/nginx/sites-available/goinfinity.conf
#  Ativar com:   ln -s ../sites-available/goinfinity.conf /etc/nginx/sites-enabled/
#
#  ORDEM IMPORTA: suba primeiro só o bloco :80 (comentando os dois blocos TLS),
#  rode o certbot, e só então descomente o restante. O certbot precisa responder
#  o desafio HTTP-01 na porta 80 antes de existir certificado algum.
#
#  SE A VPS NÃO TIVER IPv6: comente as três linhas `listen [::]:...`. Com IPv6
#  desabilitado no kernel, o nginx falha ao subir com
#  "socket() [::]:80 failed (97: Address family not supported by protocol)".
#
#  Sintaxe validada em nginx 1.24.0.
# =============================================================================

# --- HTTP: desafio do certbot + redirect para HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name goinfinity.com.br www.goinfinity.com.br;

    # Deixe este location acessível em HTTP para as renovações do certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://goinfinity.com.br$request_uri;
    }
}

# --- HTTPS no www: só redireciona para o apex -------------------------------
server {
    # `listen ... http2` funciona em todas as versões. A partir do nginx
    # 1.25.1 a forma moderna é uma diretiva separada, `http2 on;` — que NÃO
    # existe em versões anteriores e derruba o serviço com "unknown directive".
    # Confira com `nginx -v` antes de trocar.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goinfinity.com.br;

    ssl_certificate     /etc/letsencrypt/live/goinfinity.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goinfinity.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://goinfinity.com.br$request_uri;
}

# --- HTTPS no apex: a landing -----------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goinfinity.com.br;

    root /var/www/goinfinity;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/goinfinity.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goinfinity.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/goinfinity.access.log;
    error_log  /var/log/nginx/goinfinity.error.log;

    # ---- Cabeçalhos de segurança -------------------------------------------
    # HSTS: só ative depois de confirmar que o HTTPS está redondo. O navegador
    # guarda a diretiva, então voltar atrás leva meses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # CSP conferida contra o conteúdo real da página:
    #   script-src 'self'           -> só o script.js. O bloco JSON-LD é
    #                                  type="application/ld+json", que a CSP
    #                                  não trata como script executável.
    #   style-src 'unsafe-inline'   -> a página tem 13 atributos style="".
    #   frame-src forms.ploomes.com -> o formulário de contato.
    # Se algum dia entrar GTM, analytics ou pixel, esta linha muda junto com a
    # Política de Cookies.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://forms.ploomes.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ---- Compressão ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/ld+json image/svg+xml
               application/xml application/rss+xml;
    # WebP, PNG, JPG e WOFF2 já são comprimidos — não entram na lista.

    # brotli, se o módulo ngx_brotli estiver compilado:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Roteamento ---------------------------------------------------------
    # Aceita /politica-de-privacidade além de /politica-de-privacidade.html.
    # O canonical de cada página aponta para a versão .html, então as duas
    # formas não geram conteúdo duplicado para o Google.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- Cache --------------------------------------------------------------
    # ATENÇÃO: `add_header` não é herdado por um location que declare os seus
    # próprios. Por isso os blocos abaixo repetem os cabeçalhos de segurança.
    # Se você editar um cabeçalho lá em cima, edite aqui também.
    set $sec_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://forms.ploomes.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests";

    # HTML sempre revalidado: publicação nova aparece na hora.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $sec_csp always;
    }

    # Fontes nunca mudam de conteúdo sob o mesmo nome.
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Imagens, CSS e JS: 30 dias. Não são versionados por hash, então cache de
    # um ano deixaria visitantes recorrentes presos a uma versão antiga depois
    # de uma republicação.
    location ~* \.(css|js|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /robots.txt  { expires 1d; access_log off; }
    location = /sitemap.xml { expires 1d; }

    # Nada de arquivo de trabalho servido por engano.
    location ~ /\.                        { deny all; }
    location ~* \.(md|sh|conf|ai|psd|7z)$ { deny all; }
}
