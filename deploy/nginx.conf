# =============================================================================
#  Infinity System — server block interno (dentro do container, porta 80).
#
#  O que este arquivo NÃO faz — de propósito, porque é responsabilidade do
#  Traefik (ver docker-compose.prod.yml):
#    - TLS / certificado Let's Encrypt
#    - redirect HTTP -> HTTPS
#    - redirect www.goinfinity.com.br -> goinfinity.com.br
#    - cabeçalhos de segurança (HSTS, CSP, X-Content-Type-Options, ...)
#
#  O que ele faz: roteamento de URL sem .html, página 404 própria, política de
#  cache por tipo de arquivo, gzip e bloqueio de arquivos de trabalho.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    # ---- Compressão ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/ld+json image/svg+xml
               application/xml application/rss+xml;
    # WebP, PNG, JPG e WOFF2 já são comprimidos — não entram na lista.

    # ---- Roteamento -------------------------------------------------------
    # Aceita /politica-de-privacidade além de /politica-de-privacidade.html.
    # O canonical de cada página aponta para a versão .html, então as duas
    # formas não geram conteúdo duplicado para o Google.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- Cache ------------------------------------------------------------
    # HTML sempre revalidado: publicação nova aparece na hora.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fontes nunca mudam de conteúdo sob o mesmo nome.
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens, CSS e JS: 30 dias. Não são versionados por hash, então cache de
    # um ano deixaria visitantes recorrentes presos a uma versão antiga depois
    # de uma republicação. Para forçar atualização, renomeie o arquivo.
    location ~* \.(css|js|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /robots.txt  { expires 1d; access_log off; }
    location = /sitemap.xml { expires 1d; }

    # Nada de arquivo de trabalho servido por engano.
    location ~ /\.                        { deny all; }
    location ~* \.(md|sh|conf|ai|psd|7z)$ { deny all; }
}
