# =============================================================================
#  Infinity System — vhost do nginx do HOST (VPS da Refrisat / HBR Holding)
#  goinfinity.com.br
#
#  Instalar em:  /etc/nginx/sites-available/goinfinity.com.br
#  Ativar com:   ln -s ../sites-available/goinfinity.com.br /etc/nginx/sites-enabled/
#                nginx -t && systemctl reload nginx
#
#  ORDEM IMPORTA:
#    1. Suba este arquivo como está (só o bloco :80).
#    2. Aponte o DNS  A goinfinity.com.br -> 72.61.44.210  (SEM registro AAAA).
#    3. Depois da propagação, rode:
#         certbot --nginx -d goinfinity.com.br
#       O certbot adiciona o bloco 443 (com o certificado), converte o :80 num
#       redirect 301 -> https, e cadastra a renovação automática (certbot.timer).
#
#  O container (docker-compose.host-nginx.yml) publica em 127.0.0.1:8081 e serve
#  o estático. Roteamento de URL sem .html, 404 próprio, cache por tipo e gzip
#  ficam DENTRO do container (deploy/nginx.conf) — não repetir aqui.
#
#  Cabeçalhos de segurança: responsabilidade deste vhost (o container não os
#  emite). Se a CSP mudar, muda aqui.
# =============================================================================

server {
    listen 80;
    server_name goinfinity.com.br;

    # Cabeçalhos de segurança. Ficam já no :80 porque o certbot copia este
    # bloco para o 443 ao emitir o certificado.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://forms.ploomes.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }
}
